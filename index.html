
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Plan your day, one task at a time.</p>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                maxlength="200"
                required
            >
            <button type="submit">Add Task</button>
        </form>

        <div class="task-summary">
            <span id="task-count">0 tasks remaining</span>
            <button id="clear-completed" class="secondary" type="button">
                Clear Completed
            </button>
        </div>

        <ul id="task-list"></ul>
        <p id="empty-message">No tasks yet. Add your first task!</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
